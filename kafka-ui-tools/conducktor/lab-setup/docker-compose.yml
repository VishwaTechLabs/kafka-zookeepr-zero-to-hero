services:
  postgresql:
    image: postgres:14
    container_name: conduktor-postgresql
    restart: unless-stopped
    network_mode: host
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    volumes:
      - conduktor_pg_data:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - listen_addresses=127.0.0.1
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  conduktor-console:
    image: conduktor/conduktor-console:latest
    container_name: conduktor-console
    restart: unless-stopped
    network_mode: host
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      CDK_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:5432/${POSTGRES_DB}
      CDK_ORGANIZATION_NAME: ${CDK_ORGANIZATION_NAME}
      CDK_ADMIN_EMAIL: ${CDK_ADMIN_EMAIL}
      CDK_ADMIN_PASSWORD: ${CDK_ADMIN_PASSWORD}
      CDK_LISTENING_PORT: ${CDK_LISTENING_PORT}
      # Add CDK_LICENSE=${CDK_LICENSE} if your Conduktor onboarding/license requires it.
    volumes:
      - conduktor_data:/var/conduktor
    healthcheck:
      test:
        ["CMD-SHELL", "curl --fail http://127.0.0.1:${CDK_LISTENING_PORT}/api/health/live"]
      interval: 10s
      start_period: 120s
      timeout: 5s
      retries: 12

volumes:
  conduktor_pg_data:
  conduktor_data:
